<section
  id="chat-screen"
  class="hidden flex-1 flex flex-col bg-slate-100 overflow-hidden"
>
  <div
    class="flex items-center justify-between px-6 py-3 border-b bg-white/90 backdrop-blur shrink-0"
  >
    <div class="flex items-center gap-2">
      <i data-lucide="message-circle" class="text-sky-600 w-5 h-5"></i>
      <div>
        <p class="text-sm font-semibold text-slate-800">Agentic Database Chat</p>
        <p class="text-[11px] text-emerald-600 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          Structured tools • local execution
        </p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button
        id="auto-analyze"
        class="text-xs text-violet-600 hover:text-violet-800 flex items-center gap-1 px-2 py-1 rounded-lg bg-violet-50"
        title="Let the schema agent choose and run a useful analysis"
      >
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>Auto analyze
      </button>
      <button
        id="schema-toggle"
        class="md:hidden text-xs text-slate-500 hover:text-slate-700 flex items-center gap-1"
      >
        <i data-lucide="panel-left-open" class="w-4 h-4"></i> Schema
      </button>
      <button
        id="clear-agent-memory"
        class="text-xs text-slate-500 hover:text-red-600 flex items-center gap-1"
        title="Clear this database's conversation memory"
      >
        <i data-lucide="brain-circuit" class="w-3.5 h-3.5"></i>Clear memory
      </button>
      <button
        id="clear-agent-learning"
        class="text-xs text-slate-500 hover:text-red-600 flex items-center gap-1"
        title="Delete saved run evaluations and learned examples for this database"
      >
        <i data-lucide="history" class="w-3.5 h-3.5"></i>Clear learning
      </button>
      <button
        id="back-to-upload"
        class="text-xs text-slate-500 hover:text-slate-700 flex items-center gap-1"
      >
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>Back
      </button>
    </div>
  </div>
  <div class="flex-1 flex overflow-hidden">
    <aside
      id="schema-drawer"
      class="fixed inset-y-0 left-0 w-64 bg-white shadow-xl z-30 transform -translate-x-full transition-transform md:static md:flex md:w-64 md:flex-col md:border-r md:border-slate-200 md:bg-white/90 md:backdrop-blur-sm md:shadow-none md:translate-x-0"
    >
      <div
        class="px-4 py-3 border-b text-xs font-semibold text-slate-600 flex items-center justify-between"
      >
        <span class="flex items-center gap-2"
          ><i data-lucide="network" class="w-4 h-4 text-sky-500"></i> Schema
          Overview</span
        >
        <button id="schema-close" class="md:hidden text-[10px] text-slate-500">
          Close
        </button>
      </div>
      <div
        id="schema-content"
        class="flex-1 overflow-y-auto p-3 text-[11px] space-y-3"
      ></div>
    </aside>
    <div class="flex-1 flex flex-col min-w-0">
      <div id="chat-thread" class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
        <div class="flex justify-start">
          <div
            class="bg-slate-50 px-3 py-2.5 text-xs rounded-2xl shadow-sm max-w-[80%]"
          >
            Hello! I'm ready to answer questions about your data.
          </div>
        </div>
        <div
          id="agent-suggestions"
          class="flex flex-wrap gap-2"
          aria-label="Suggested analyses based on available columns"
        ></div>
      </div>
      <div class="border-t bg-white px-4 py-3 flex items-center gap-3 shrink-0">
        <input
          id="chat-input"
          type="text"
          placeholder="Ask your database..."
          class="flex-1 p-3 border border-slate-200 rounded-2xl text-xs focus:ring-2 focus:ring-sky-500"
        />
        <button
          id="chat-cancel"
          class="hidden inline-flex items-center gap-2 px-4 py-2 rounded-2xl text-xs bg-red-50 text-red-600 hover:bg-red-100 transition"
        >
          <i data-lucide="square" class="w-3.5 h-3.5"></i>Cancel
        </button>
        <button
          id="chat-send"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl text-xs bg-sky-600 text-white hover:bg-sky-700 transition"
        >
          <i data-lucide="send" class="w-4 h-4"></i>Send
        </button>
      </div>
    </div>
    <aside
      id="agent-activity-panel"
      class="hidden xl:flex xl:w-72 xl:flex-col border-l border-slate-200 bg-white/90"
    >
      <div class="px-4 py-3 border-b">
        <p class="text-xs font-semibold text-slate-700 flex items-center gap-2">
          <i data-lucide="workflow" class="w-4 h-4 text-violet-500"></i>
          Agent activity
        </p>
        <p id="agent-budget" class="text-[10px] text-slate-400 mt-1">
          No task running
        </p>
        <div
          id="agent-metrics"
          class="grid grid-cols-3 gap-1.5 mt-2"
          aria-label="Agent quality metrics"
        ></div>
      </div>
      <div id="agent-activity" class="flex-1 overflow-y-auto p-3">
        <p class="text-[11px] text-slate-400">
          Plans and local tool actions will appear here.
        </p>
      </div>
    </aside>
  </div>
</section>
