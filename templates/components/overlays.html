<div
  id="loading-overlay"
  class="hidden absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-30"
>
  <div class="bg-white rounded-2xl px-6 py-4 shadow-lg flex items-center gap-3">
    <div class="flex gap-1">
      <div class="w-2 h-2 rounded-full bg-sky-500 animate-bounce"></div>
      <div
        class="w-2 h-2 rounded-full bg-sky-400 animate-bounce [animation-delay:100ms]"
      ></div>
      <div
        class="w-2 h-2 rounded-full bg-sky-300 animate-bounce [animation-delay:200ms]"
      ></div>
    </div>
    <p class="text-xs text-slate-600" id="loading-text">Please wait...</p>
  </div>
</div>
<div
  id="error-toast"
  class="hidden absolute top-4 right-4 bg-red-500 text-white text-xs px-4 py-3 rounded-lg shadow-lg z-50"
>
  <span id="error-message"></span>
</div>

<div
  id="eda-report-modal"
  class="hidden fixed inset-0 bg-slate-950/50 backdrop-blur-sm z-50 p-3 md:p-8"
  role="dialog"
  aria-modal="true"
  aria-labelledby="eda-report-title"
>
  <div class="mx-auto h-full max-w-6xl rounded-2xl bg-slate-50 shadow-2xl flex flex-col overflow-hidden">
    <div class="flex items-center justify-between gap-3 border-b border-slate-200 bg-white px-5 py-3">
      <div>
        <h2 id="eda-report-title" class="text-sm font-semibold text-slate-800">
          Exploratory data analysis report
        </h2>
        <p id="eda-report-subtitle" class="text-[11px] text-slate-500 mt-0.5">
          Deterministic statistics computed locally
        </p>
      </div>
      <div class="flex items-center gap-2">
        <button
          id="eda-report-download"
          class="hidden text-xs text-sky-700 hover:text-sky-900 px-3 py-1.5 rounded-lg bg-sky-50"
        >
          Download JSON
        </button>
        <button
          id="eda-report-close"
          class="text-xs text-slate-500 hover:text-slate-800 px-3 py-1.5 rounded-lg bg-slate-100"
        >
          Close
        </button>
      </div>
    </div>
    <div id="eda-report-content" class="flex-1 overflow-y-auto p-4 md:p-6">
      <p class="text-xs text-slate-500">Choose EDA report to begin.</p>
    </div>
  </div>
</div>
